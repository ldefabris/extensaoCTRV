<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Snippet Injector Pro</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --success: #10b981;
        }
        body { 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            width: 350px; 
            margin: 0; 
            padding: 20px; 
            background-color: var(--bg);
            color: var(--text);
        }
        h3 { 
            margin-top: 0; 
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
            text-align: center;
            margin-bottom: 20px;
        }
        .section-label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-light);
            margin-bottom: 8px;
            display: block;
        }
        .input-group { 
            display: flex; 
            flex-direction: column;
            margin-bottom: 15px; 
            gap: 10px;
        }
        .main-input-row {
            display: flex;
            gap: 5px;
        }
        #snippetInput, #tagInput { 
            flex-grow: 1; 
            padding: 10px; 
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        #snippetInput:focus, #tagInput:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }
        #addBtn { 
            padding: 10px 16px; 
            cursor: pointer; 
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        #addBtn:hover {
            background-color: var(--primary-hover);
        }
        
        .duration-setup {
            display: flex;
            justify-content: space-between;
            background: var(--card);
            padding: 8px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 15px;
        }
        .duration-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            flex: 1;
        }
        .duration-option input {
            display: none;
        }
        .duration-option span {
            font-size: 10px;
            color: var(--text-light);
            padding: 4px 8px;
            border-radius: 4px;
            text-align: center;
            width: 100%;
        }
        .duration-option input:checked + span {
            background-color: var(--primary);
            color: white;
            font-weight: 600;
        }

        .filter-section {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #tagFilter {
            flex-grow: 1;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-size: 13px;
            background: var(--card);
        }

        ul { 
            list-style: none; 
            padding: 0; 
            margin: 0; 
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            max-height: 250px;
            overflow-y: auto;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        li { 
            display: flex; 
            flex-direction: column;
            padding: 12px; 
            border-bottom: 1px solid var(--border); 
            position: relative;
        }
        li:last-child {
            border-bottom: none;
        }
        .snippet-content {
            font-size: 14px;
            line-height: 1.4;
            word-break: break-word;
            margin-bottom: 6px;
            padding-right: 25px;
        }
        .snippet-meta {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .tag-badge {
            font-size: 10px;
            background: #e0e7ff;
            color: #4338ca;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 500;
        }
        .ttl-badge {
            font-size: 10px;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .delete-btn { 
            position: absolute;
            top: 10px;
            right: 10px;
            color: var(--text-light); 
            cursor: pointer; 
            border: none; 
            background: none; 
            font-size: 16px;
            padding: 2px 6px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .delete-btn:hover {
            color: var(--danger);
            background: #fee2e2;
        }
        .empty-msg {
            padding: 20px;
            text-align: center;
            color: var(--text-light);
            font-size: 14px;
        }

        .action-section {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        .action-btn {
            flex: 1;
            font-size: 11px;
            background: white;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 5px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .action-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: #f5f3ff;
        }
        .action-btn.export-btn:hover {
            border-color: var(--success);
            color: var(--success);
            background: #ecfdf5;
        }
    </style>
</head>
<body>
    <h3>Snippet Injector Pro</h3>
    
    <div class="input-group">
        <span class="section-label">Novo Snippet</span>
        <div class="main-input-row">
            <input type="text" id="snippetInput" placeholder="Digite a frase...">
            <button id="addBtn">Salvar</button>
        </div>
        <input type="text" id="tagInput" placeholder="Tags (ex: trabalho, pessoal)">
    </div>

    <span class="section-label">Duração</span>
    <div class="duration-setup">
        <label class="duration-option">
            <input type="radio" name="ttl" value="0" checked>
            <span>Permanente</span>
        </label>
        <label class="duration-option">
            <input type="radio" name="ttl" value="300">
            <span>5 min</span>
        </label>
        <label class="duration-option">
            <input type="radio" name="ttl" value="3600">
            <span>1h</span>
        </label>
        <label class="duration-option">
            <input type="radio" name="ttl" value="86400">
            <span>1d</span>
        </label>
        <label class="duration-option">
            <input type="radio" name="ttl" value="2592000">
            <span>30d</span>
        </label>
    </div>

    <div class="filter-section">
        <span class="section-label" style="margin-bottom: 0;">Filtrar:</span>
        <select id="tagFilter">
            <option value="all">Todas as tags</option>
        </select>
    </div>

    <ul id="snippetList"></ul>

    <div class="action-section">
        <button id="exportBtn" class="action-btn export-btn">
            <span>📥</span> Exportar JSON
        </button>
        <button id="importBtn" class="action-btn">
            <span>📤</span> Importar JSON
        </button>
        <input type="file" id="fileInput" style="display: none;" accept=".json">
    </div>

    <script type="module" src="popup.js"></script>
</body>
</html>
