<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Snippet Injector</title>
    <style>
        body { 
            font-family: sans-serif; 
            width: 300px; 
            margin: 0; 
            padding: 15px; 
            background-color: #f9f9f9;
        }
        h3 { 
            margin-top: 0; 
            color: #333;
            text-align: center;
        }
        .input-group { 
            display: flex; 
            margin-bottom: 15px; 
            gap: 5px;
        }
        #snippetInput { 
            flex-grow: 1; 
            padding: 8px; 
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        #addBtn { 
            padding: 8px 12px; 
            cursor: pointer; 
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
        }
        #addBtn:hover {
            background-color: #0056b3;
        }
        ul { 
            list-style: none; 
            padding: 0; 
            margin: 0; 
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        li { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 10px; 
            border-bottom: 1px solid #eee; 
            word-break: break-word;
        }
        li:last-child {
            border-bottom: none;
        }
        .delete-btn { 
            color: #dc3545; 
            cursor: pointer; 
            border: none; 
            background: none; 
            font-weight: bold;
            padding: 5px;
            margin-left: 10px;
        }
        .delete-btn:hover {
            color: #a71d2a;
        }
        .empty-msg {
            padding: 10px;
            text-align: center;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h3>Snippet Injector</h3>
    <div class="input-group">
        <input type="text" id="snippetInput" placeholder="Digite a frase/snippet...">
        <button id="addBtn">Adicionar</button>
    </div>
    <ul id="snippetList"></ul>
    <script src="popup.js"></script>
</body>
</html>
